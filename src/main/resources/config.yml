# Pumpkin Eventos - Configuración General

tab:
  player-format: "<prefix> <player> <suffix>"
  header: |
    <newline>
    <b><color:#FFCD00>LYRIC </color></b> <color:#AAAAAA>|</color> <color:#FFFFFF>Eventos</color>
    <newline>

  footer: |
    <newline>
       <#00FF00>🔔 <#FFFFFF>Jugadores: <#FFFF00>%players%   
       <#FFAA00>mc.liric.xyz   
    <newline>

holograma:
  display_uuid: ""
  interaction_uuid: ""
  # Opciones visuales
  billboard: CENTER # FIXED, CENTER, VERTICAL, HORIZONTAL
  shadow: true
  background_color: "#00000000" # Formato ARGB (#TransparenciaRojoVerdeAzul)
  scale: 1.5

miniwalls:
  wall_blocks:
    - "BEDROCK"
    - "BARRIER"
    - "BLACK_STAINED_GLASS"
    - "OBSIDIAN"