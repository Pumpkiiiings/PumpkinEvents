# Pumpkin Eventos - Configuración General

tab:
  player-format: "<prefix><reset> <player> %eventos_team%"
  header: |
    <newline>
    <b><color:#FFCD00>LYRIC </color></b> <color:#AAAAAA>|</color> <color:#FFFFFF>Eventos</color>
    <newline>

  footer: |
    <newline>
       <#00FF00>🔔 <#FFFFFF>Jugadores: <#FFFF00>%players%   
       <#FFAA00>mc.liric.xyz   
    <newline>

holograma:
  display_uuid: ""
  interaction_uuid: ""
  # Opciones visuales
  billboard: CENTER # FIXED, CENTER, VERTICAL, HORIZONTAL
  shadow: true
  background_color: "#00000000" # Formato ARGB (#TransparenciaRojoVerdeAzul)
  scale: 1.5

miniwalls:
  wall_blocks:
    - "BEDROCK"
    - "BARRIER"
    - "BLACK_STAINED_GLASS"
    - "OBSIDIAN"
  # Bloques que los jugadores SÍ pueden romper aunque no los hayan colocado
  breakable_blocks:
    # Lanas (Bases de los equipos)
    - "RED_WOOL"
    - "BLUE_WOOL"
    - "YELLOW_WOOL"
    - "GREEN_WOOL"
    - "WHITE_WOOL"
    # Materiales de Construcción Comunes
    - "DIRT"
    - "GRASS_BLOCK"
    - "COBBLESTONE"
    - "STONE"
    - "OAK_PLANKS"
    - "SPRUCE_PLANKS"
    - "BIRCH_PLANKS"
    - "BRICKS"
    - "SAND"
    - "GRAVEL"
    # Vegetación (Para limpiar el terreno de la arena)
    - "OAK_LEAVES"
    - "SPRUCE_LEAVES"
    - "BIRCH_LEAVES"
    - "TALL_GRASS"
    - "SHORT_GRASS"
    - "DANDELION"
    - "POPPY"
    - "BLUE_ORCHID"
    - "ALLIUM"
    - "AZURE_BLUET"
    - "RED_TULIP"
    - "ORANGE_TULIP"
    - "WHITE_TULIP"
    - "PINK_TULIP"
    - "OXEYE_DAISY"
    - "CORNFLOWER"
    - "LILY_OF_THE_VALLEY"

# ==========================================
# TNT TAG — Items Especiales
# ==========================================
tnttag:
  # Umbral de jugadores para activar glow en todos
  glow_threshold: 6
  items:
    dash:
      enabled: true
      cooldown_ticks: 600       # 30 segundos (20 ticks = 1 segundo)
      velocity_horizontal: 1.8
      velocity_vertical: 0.3
    doublejump:
      enabled: true
      cooldown_ticks: 600       # 30 segundos
      velocity_horizontal: 0.5
      velocity_vertical: 1.3

# ==========================================
# SUELO ES LAVA — Modo Caos
# ==========================================
suelolava:
  chaos_mode:
    enabled: true
    # Con cuantos jugadores vivos se puede activar el modo caos
    alive_threshold: 4
    # Segundos sin muertes para activar el modo caos
    idle_seconds: 60
    # Cantidad de flechas a dar
    bow_arrows: 3

# ==========================================
# EXTRAS (Eventos Aleatorios / Desastres)
# ==========================================
extras_vote:
  enabled: true
  interval_seconds: 180   # Se lanza una votación cada 3 minutos
  duration_seconds: 15    # Tiempo para que los jugadores voten
  options:
    - "lava"
    - "storm"
    - "anvils"
    - "geoffrey"
    - "acidrain"
    - "zerogravity"
    - "antlife"

  # En qué juegos se permite que salga la votación de extras
  allowed_games:
    - "tntrun"
    - "tnttag"
    - "suelolava"
    - "pillars"
    - "miniwalls"
    - "skywars_solos"
    - "skywars_duos"

# ==========================================
# VOTACIÓN DE EFECTOS (cada X segundos durante el juego)
# ==========================================
potion_vote:
  enabled: true
  interval_seconds: 120   # Cada 2 minutos
  duration_seconds: 15    # La votación dura 15 segundos
  effect_duration_seconds: 60  # Cuánto dura el efecto ganador

# ==========================================
# CONFIGURACIÓN HIDE AND SEEK
# ==========================================
hideandseek:
  solidify_seconds: 5
  eye_cooldown_seconds: 60
  eye_duration_seconds: 5
  preparation_seconds: 30
  game_duration_seconds: 300
  decoys_per_player: 3
  decoy_spawn_radius: 25

pvp_vote:
  # Define en qué modos se lanza la votación de PvP
  tnttag: true
  tntrun: false
  simondice: false
  suelolava: true
  pillars: false
  sumo: false
  spleef: false
  tntspleef: false
  luzroja: false
  sillas: false
  ruletarusa: false
  cristales: false
  jalarcuerda: false
  skywars_solos: false
  skywars_duos: false
  iceboat: false
  miniwalls: false
  corona: false

# ==========================================
# BUILD BATTLE
# ==========================================
buildbattle:
  plot_radius: 15          # Radio en bloques de cada parcela (cuadrado ±radius)
  plot_height: 15          # Altura máxima y mínima en bloques de cada parcela (cubo ±height)
  build_time_seconds: 300  # 5 minutos de construcción
  vote_time_seconds: 30    # 30 segundos por parcela en votación

# ==========================================
# BATTLE ROYALE
# ==========================================
battleroyale:
  timer: 600               # Duración total de la partida en segundos (10 min)
  border_initial: 500.0    # Tamaño inicial del borde (radio en bloques)
  team_select_time: 15     # Segundos para elegir equipo (solo dúos)
  vote_time: 10            # Segundos para votar el tipo de cofre

  # Momentos en los que se rellenan los cofres (segundos restantes)
  refill1_at: 300          # Primer refill a los 5 min
  refill2_at: 120          # Segundo refill a los 8 min

  # Fases del borde (NO editar el número de fases, sí los valores)
  # Cada fase se activa en el segundo indicado en BR_PHASE_TIMESTAMPS (BattleRoyaleEvents.kt)
  # Para cambiar los valores edita BattleRoyaleEvents.kt → BR_BORDER_PHASES / BR_PHASE_TIMESTAMPS

# ==========================================
# PARKOUR
# ==========================================
parkour:
  timer: 300                  # Tiempo total en segundos
  team_select_time: 15        # Segundos de selección de equipo (solo dúos)
  prestart_time: 10           # Cuenta atrás antes de quitar el muro
  max_winners: 5              # Jugadores/equipos en el podio
  cancel_fall_damage: true    # Desactivar daño de caída
  checkpoint_radius: 1.0      # Área de detección: 1.0 = área 2×2 (±1 bloque en X y Z)
  wall_material: GLASS        # Material del muro de inicio

  # Puntos por posición (1er lugar, 2do, 3ro, 4to, 5to)
  points:
    - 50
    - 40
    - 30
    - 20
    - 10

  # Chain API (lode.gg) — solo modo dúos
  # El no-líder queda encadenado al líder al iniciar el juego.
  # Si lode.gg no está instalado, el sistema se omite sin error.
  chain:
    enabled: true
    max_distance: 5           # Distancia máxima en bloques antes de jalar


